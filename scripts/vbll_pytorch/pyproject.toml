[project]
name = "vbll-experiments"
version = "0.1.0"
description = "The VBLL baseline head for DINOv3 linear probing and fine-tuning"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "vbll>=0.2.0",
    "mlflow>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vbll_experiments"]

[dependency-groups]
dev = ["pytest>=8.0.0"]
