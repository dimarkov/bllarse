[project]
name = "bllarse"
version = "0.2.0"
description = "Learning Bayesian last layers on top of deep neural networks with sparse priors and Bayesian model reduction"
readme = "README.md"
authors = [
    { name = "Dimitrije Markovic", email = "5038100+dimarkov@users.noreply.github.com" },
    { name = "Conor Heins", email = "conor.heins@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.5.0",
    "equimo>=0.3.3",
    "augmax>=0.3.4",
    "tqdm>=4.67.1",
    "pillow>=11.1.0",
    "ipykernel>=6.29.5",
    "jax[cuda]>=0.6.2",
    "optax>=0.2.4",
    "tfp-nightly[jax]>=0.25",
    "dotenv<1.0.0",
    "mlpox @ git+https://github.com/dimarkov/mlpox.git@main",
    "blrax @ git+https://github.com/dimarkov/blrax.git@main"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "matplotlib>=3.10.3",
    "seaborn>=0.13.0",
    "mlflow>=3.9.0",
    "pytest>=8.3.5",
    # Both container images already pin this; without it locally, the module
    # level `importorskip` in tests/tuning/test_worker.py silently skipped the
    # WHOLE file -- so `trial_config`, which builds the config for every trial
    # of every campaign, had no local coverage at all.
    "optuna>=4.0",
]
alternatives = [
    "transformers[flax]>=4.35.0",
    "sentencepiece>=0.2.0",
]
vbll = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "vbll>=0.2.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
