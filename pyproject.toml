[project]
name = "bllarse"
version = "0.2.0"
description = "Learning Bayesian last layers on top of deep neural networks with sparse priors and Bayesian model reduction"
readme = "README.md"
authors = [
    { name = "Dimitrije Markovic", email = "5038100+dimarkov@users.noreply.github.com" },
    { name = "Conor Heins", email = "conor.heins@gmail.com" }
]
# 3.12 is the floor because jax 0.11 requires it. Every environment
# this project runs in (local venv, the Raven fine-tuning venv, both
# container images) is already 3.12, so this drops no platform in use.
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.5.0",
    "equimo>=0.3.3",
    "augmax>=0.3.4",
    "tqdm>=4.67.1",
    "pillow>=11.1.0",
    "ipykernel>=6.29.5",
    # PINNED, not a floor. `>=0.6.2` let every environment resolve whatever
    # was newest the day it was built, so the local venv landed on 0.10.0 and
    # Raven's on 0.9.2 -- a difference nobody chose, sitting inside every
    # cross-machine throughput comparison. Campaign results have to be
    # attributable to the campaign, not to which day an environment was
    # created.
    #
    # 0.10.2 rather than the newest, because 0.11.0 does not run the
    # fine-tuning step on Raven's A100 nodes. It dies in
    # `jit(ce_micro_grad)/transpose(jvp(vmap(eqx.nn.Conv)))/conv_general_dilated`
    # with CUDA_ERROR_ILLEGAL_ADDRESS before reaching a single evaluation. Two
    # tempting explanations were tested and refuted: disabling command buffers
    # (`--xla_gpu_enable_command_buffer=`) changes nothing, and a compilation
    # cache populated by an older jax is not to blame either -- a fresh cache
    # fails identically. A version bisect over the real trial (not
    # scripts/finetune/bench_step.py, which 0.11.0 PASSES and which is
    # therefore not a reproducer) puts the break at exactly 0.11.0: 0.9.2,
    # 0.10.0, 0.10.1 and 0.10.2 all complete.
    #
    # Revisit after a driver or jax point release, with one short smoke
    # (BLLARSE_FT_MAX_SAMPLES=131072) rather than by pointing an array at it.
    "jax[cuda]==0.10.2",
    "optax>=0.2.4",
    "tfp-nightly[jax]>=0.25",
    "dotenv<1.0.0",
    "blrax @ git+https://github.com/dimarkov/blrax.git@main"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "matplotlib>=3.10.3",
    "seaborn>=0.13.0",
    "mlflow>=3.9.0",
    "pytest>=8.3.5",
    # Both container images already pin this; without it locally, the module
    # level `importorskip` in tests/tuning/test_worker.py silently skipped the
    # WHOLE file -- so `trial_config`, which builds the config for every trial
    # of every campaign, had no local coverage at all.
    "optuna>=4.0",
]
vbll = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "vbll>=0.2.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
